name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

# Prevent two deploys from racing each other against the same server.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pulls master, rebuilds the image and recreates the container. The server's
      # .env (not in git) holds the API secrets and HOST_PORT.
      - name: Pull, build and restart the dashboard
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_PATH }}"

            git fetch origin master
            git reset --hard origin/master

            docker compose build dashboard
            docker compose up -d --no-deps dashboard

            HOST_PORT="$(grep -E '^HOST_PORT=' .env | cut -d= -f2)"
            for i in $(seq 1 15); do
              if curl -fs "http://127.0.0.1:${HOST_PORT}/" > /dev/null; then
                echo "Dashboard is healthy on port ${HOST_PORT}"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "Dashboard did not become healthy after deploy" >&2
            exit 1
